<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Content-Security-Policy — defence-in-depth around the BlockNote editor.
  The editor mounts user markdown; BlockNote parses content structurally
  (no innerHTML) so direct XSS from content is not possible today, but CSP
  makes sure a future BlockNote regression cannot exfiltrate notes to
  arbitrary origins. BlockNote + ProseMirror are now vendored locally and
  served from the private `dayflow-asset://editor/` origin (see
  EditorSchemeHandler.swift), so no network origin is allowed at all:
  `script-src`/`style-src` are `'self'` only, and `connect-src 'none'`
  closes the exfiltration channel of choice.

  `img-src` additionally names the bare `dayflow-asset:` scheme: pasted
  images are served from a *second* host on it
  (`dayflow-asset://attachment/<name>`, see AttachmentStore), which is a
  different origin than `'self'`. Remote origins stay barred, so an `<img>`
  smuggled in through pasted HTML still cannot phone home.

  `'wasm-unsafe-eval'` lets the code-block highlighter (shiki) compile its
  bundled Oniguruma regex engine. It admits WebAssembly compilation only —
  string `eval`/`new Function` stay blocked — and the module is inlined in the
  vendored bundle, so nothing is fetched.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: dayflow-asset:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<link rel="stylesheet" href="dayflow-asset://editor/style.css">
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    color: rgba(var(--ink),0.92);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui;
    -webkit-font-smoothing: antialiased;
}
body {
    display: flex;
    flex-direction: column;
}
#editor {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    /* WebKit excludes padding-bottom from scrollable area on
       overflow:auto containers — push the bottom breathing room
       onto the inner BlockNote container instead so the last
       block doesn't sit flush against the editor edge. */
    padding: 16px 8px 0 8px;
}
.bn-container { padding-bottom: 24px; }
/* The default WebKit scrollbar drew a light track down the whole editor at
   all times. Thin, and visible only while the pointer is over the editor. */
#editor::-webkit-scrollbar { width: 8px; }
#editor::-webkit-scrollbar-track { background: transparent; }
#editor::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
#editor:hover::-webkit-scrollbar-thumb { background: rgba(var(--ink), 0.14); }
#editor:hover::-webkit-scrollbar-thumb:hover { background: rgba(var(--ink), 0.24); }
/* Brief highlight on the heading the Day rail jumped to. */
.dayflow-flash {
    background: rgba(247, 140, 51, 0.12);
    border-radius: 6px;
    transition: background 0.6s ease;
}
/* Dayflow's own formatting strip. BlockNote's React-side toolbar
   component isn't loaded (we're on @blocknote/core only), so we
   build a minimal vanilla one that calls editor.toggleStyles /
   addStyles / removeStyles directly. */
/* Toolbar is a column of logical groups that wrap as units, not as
   individual buttons. On wide containers (Day view, ~1200px) all
   groups land on one row; on narrow containers (Month plan rail,
   ~300px) each group drops onto its own line cleanly. */
#dayflow-toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 6px;
    column-gap: 10px;
    padding: 6px 12px;
    background: rgba(var(--panel), 0.7);
    border-bottom: 1px solid rgba(var(--ink), 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 13px;
    user-select: none;
    transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
/* Formatting only applies to a selection, so with none the bar recedes:
   no panel, faint glyphs. It stays in place (a floating bar over the text
   gets its clicks swallowed by BlockNote's overlays — see #dayflow-color-pop)
   and comes back on selection, hover, or an open colour row. */
body:not(.has-selection) #dayflow-toolbar:not(:hover):not(.pop-open) {
    opacity: 0.3;
    background: transparent;
    border-bottom-color: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}
#dayflow-toolbar .tb-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    /* Never break a group across rows. */
    flex: 0 0 auto;
}
/* The twelve colour swatches used to sit open on the bar, which made a
   note-taking app open on a wall of controls. They live behind two trigger
   buttons now, and expand into a row of their own when one is pressed. */
/* Trigger: a glyph with a thin bar underneath showing the colour that
   is currently applied, the way Word/Docs mark theirs. */
#dayflow-toolbar .tb-pop {
    flex-direction: column;
    gap: 2px;
    padding: 0 5px;
}
#dayflow-toolbar .tb-pop .glyph {
    font-size: 12px;
    line-height: 11px;
}
#dayflow-toolbar .tb-pop .ink {
    width: 14px;
    height: 3px;
    border-radius: 2px;
    background: rgba(var(--ink), 0.22);
}
/* The swatch panel expands INSIDE the toolbar — it takes a full flex row and
   pushes the editor down, rather than floating over it.
   A floating panel was the obvious design and it did not work: it painted
   correctly, but BlockNote lays invisible overlays across the editor surface,
   and those swallowed the mousedown and handed it to ProseMirror. The panel
   looked open, you clicked a colour, and the caret jumped instead. Staying in
   the toolbar's own flow sidesteps hit-testing against the editor entirely —
   the B/I/U buttons next to it have always received clicks reliably. */
#dayflow-color-pop {
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 2px 1px;
}
#dayflow-color-pop[hidden] {
    display: none;
}
#dayflow-color-pop [data-row][hidden] {
    display: none;
}
#dayflow-color-pop [data-row] {
    display: inline-flex;
    align-items: center;
    gap: 7px;
}
/* Narrow containers (Month plan rail ~440px and below): keep the two
   groups from splitting mid-group. */
@media (max-width: 540px) {
    #dayflow-toolbar .tb-group {
        flex-basis: auto;
    }
}
#dayflow-toolbar button {
    all: unset;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    border-radius: 4px;
    color: rgba(var(--ink), 0.85);
    cursor: pointer;
    font-weight: 600;
}
#dayflow-toolbar button:hover {
    background: rgba(var(--ink), 0.08);
}
#dayflow-toolbar button.active {
    background: rgba(247, 158, 51, 0.22);
    color: #f79e33;
}
#dayflow-toolbar button.italic { font-style: italic; }
#dayflow-toolbar button.underline { text-decoration: underline; }
#dayflow-toolbar button.strike { text-decoration: line-through; }
#dayflow-toolbar button.code { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; letter-spacing: -0.5px; }
#dayflow-toolbar .swatch {
    width: 18px;
    min-width: 18px;
    height: 18px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(var(--ink), 0.18);
}
#dayflow-toolbar .swatch.active {
    outline: 2px solid #f79e33;
    outline-offset: 1px;
}
#dayflow-toolbar .swatch-reset {
    background: rgba(var(--ink), 0.06);
    color: rgba(var(--ink), 0.45);
    font-size: 12px;
    line-height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* Root CSS variable set by Swift (Settings slider) so the user
   can live-adjust the editor body font. Default matches the
   pre-slider look. Headings are expressed in `em` so a single
   variable drives the whole size ramp. */
:root {
    --editor-font-size: 15px;
    /* Theme palette as r,g,b triples, pushed from Swift by
       dayflowSetTheme(); the defaults are the dark Midnight theme. */
    --ink: 255, 255, 255;
    --panel: 28, 28, 32;
    --code-bg: rgba(255, 255, 255, 0.05);
}
/* BlockNote dark theme overrides */
.bn-container, .bn-editor, .ProseMirror {
    background: transparent !important;
    color: rgba(var(--ink),0.92) !important;
    outline: none !important;
    font-size: var(--editor-font-size) !important;
    line-height: 1.7 !important;
}
.bn-block-content[data-content-type="heading"][data-level="1"] {
    font-size: 1.85em !important; font-weight: 700 !important; letter-spacing: -0.5px;
}
.bn-block-content[data-content-type="heading"][data-level="2"] {
    font-size: 1.45em !important; font-weight: 600 !important;
}
.bn-block-content[data-content-type="heading"][data-level="3"] {
    font-size: 1.2em !important; font-weight: 600 !important;
}
.bn-inline-content { color: rgba(var(--ink),0.92); }
/* BlockNote stores a pixel `previewWidth` (512 by default) on image blocks.
   The Month-plan rail is ~300px wide, so honour the stored width only up to
   the container and let the image scale down rather than overflow. */
.bn-block-content[data-content-type="image"] img,
.bn-block-content[data-content-type="image"] .bn-visual-media {
    max-width: 100% !important;
    height: auto !important;
    border-radius: 6px;
}
.bn-block-outer { padding: 1px 0; }
.bn-block .bn-block-content { padding-left: 0 !important; }
.bn-block-content[data-content-type="bulletListItem"]::before,
.bn-block-content[data-content-type="numberedListItem"]::before {
    color: rgba(var(--ink),0.45) !important;
}
/* check list item — block-note renders an actual <input type="checkbox"> */
.bn-block-content[data-content-type="checkListItem"] input[type="checkbox"] {
    accent-color: #4cc66e !important;
    width: 16px !important;
    height: 16px !important;
}
.bn-block-content[data-content-type="checkListItem"][data-checked="true"] .bn-inline-content {
    color: rgba(var(--ink),0.45) !important;
    text-decoration: line-through;
}
/* On-hold ("보류"): a parked task carries the reserved blue highlight on its
   text (set via the right-click status menu). Tint the checkbox to match so
   the whole row reads as fluorescent blue. :has() is supported in the macOS
   14 WKWebView; if it ever isn't, the blue text highlight still conveys it. */
.bn-block-content[data-content-type="checkListItem"]:has([data-background-color="blue"]) input[type="checkbox"] {
    accent-color: #26a6ff !important;
}
/* The small floating status menu shown on right-click of a checkbox. */
#dayflow-status-menu {
    position: fixed;
    z-index: 9999;
    min-width: 132px;
    background: rgb(var(--panel));
    border: 1px solid rgba(var(--ink),0.12);
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    font-size: 13px;
    color: rgba(var(--ink), 0.92);
    user-select: none;
}
#dayflow-status-menu .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
}
#dayflow-status-menu .item:hover { background: rgba(var(--ink),0.08); }
#dayflow-status-menu .dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex: 0 0 auto;
}
#dayflow-status-menu .dot.open { border: 1.5px solid rgba(var(--ink), 0.5); }
#dayflow-status-menu .dot.done { background: #4cc66e; }
#dayflow-status-menu .dot.hold { background: #26a6ff; }
.bn-block-content:not([data-content-type="codeBlock"]) code,
.bn-block-content[data-content-type="codeBlock"] {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 13px;
}
.bn-block-content:not([data-content-type="codeBlock"]) code {
    background: rgba(var(--ink),0.08);
    color: #f79e33;
    border-radius: 4px;
    padding: 1px 5px;
}
.bn-block-content[data-content-type="codeBlock"] {
    /* Always a dark block: the highlighter's palette is github-dark, which
       would wash out on a light theme's page. */
    background: var(--code-bg);
    border-radius: 6px;
    padding: 10px 12px;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.5;
}
.bn-block-content[data-content-type="quote"] {
    border-left: 3px solid rgba(247, 158, 51, 0.6);
    padding-left: 12px;
    color: rgba(var(--ink),0.75);
}
/* Table dark theme */
.bn-block-content[data-content-type="table"] table {
    border-collapse: collapse;
    width: 100%;
}
.bn-block-content[data-content-type="table"] td,
.bn-block-content[data-content-type="table"] th {
    border: 1px solid rgba(var(--ink), 0.12);
    padding: 6px 10px;
    min-width: 60px;
}
.bn-block-content[data-content-type="table"] th {
    background: rgba(var(--ink), 0.06);
    font-weight: 600;
}
.bn-block-content[data-content-type="table"] td:focus-within {
    outline: 2px solid rgba(247, 158, 51, 0.5);
    outline-offset: -2px;
}
.ProseMirror ::selection { background: rgba(247, 158, 51, 0.32); }
/* drag-handle side menu + slash-suggestion menu stay hidden to keep
   the layout minimal — the Dayflow toolbar above covers the common
   styling actions. */
/* drag-handle side menu stays hidden; slash command menu below
   is a fully custom vanilla implementation since
   @blocknote/core on its own doesn't ship a UI for it. */
.bn-side-menu { display: none !important; }
/* placeholder */
.bn-block-content[data-is-empty-and-focused="true"]::before {
    color: rgba(var(--ink),0.25) !important;
}
/* Custom slash command menu. Floats above the editor near the
   caret, gets its own filterable input row, dark-themed. */
#dayflow-slash-menu {
    position: fixed;
    z-index: 1000;
    min-width: 260px;
    max-width: 320px;
    max-height: 360px;
    overflow: hidden;
    background: rgba(var(--panel), 0.98);
    border: 1px solid rgba(var(--ink), 0.1);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    padding: 4px;
    font-size: 13px;
    color: rgba(var(--ink), 0.9);
    display: flex;
    flex-direction: column;
}
#dayflow-slash-menu .sm-list {
    overflow-y: auto;
    padding: 4px 0;
}
#dayflow-slash-menu .sm-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
}
#dayflow-slash-menu .sm-item.selected {
    background: rgba(247, 158, 51, 0.18);
    color: #f79e33;
}
#dayflow-slash-menu .sm-item .sm-icon {
    width: 20px;
    text-align: center;
    font-weight: 700;
    color: rgba(var(--ink), 0.55);
}
#dayflow-slash-menu .sm-item.selected .sm-icon {
    color: #f79e33;
}
#dayflow-slash-menu .sm-item .sm-label {
    font-weight: 600;
}
#dayflow-slash-menu .sm-item .sm-sub {
    font-size: 11px;
    color: rgba(var(--ink), 0.4);
    margin-left: auto;
}
#dayflow-slash-menu .sm-empty {
    padding: 10px;
    color: rgba(var(--ink), 0.4);
    text-align: center;
    font-size: 12px;
}
/* Table grid picker */
#dayflow-grid-picker {
    position: fixed;
    z-index: 1001;
    background: rgba(var(--panel), 0.98);
    border: 1px solid rgba(var(--ink), 0.1);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    padding: 10px;
    font-size: 12px;
    color: rgba(var(--ink), 0.7);
    user-select: none;
}
#dayflow-grid-picker .gp-grid {
    display: grid;
    grid-template-columns: repeat(6, 24px);
    grid-template-rows: repeat(6, 24px);
    gap: 3px;
    margin-bottom: 8px;
}
#dayflow-grid-picker .gp-cell {
    width: 24px;
    height: 24px;
    border-radius: 3px;
    border: 1px solid rgba(var(--ink), 0.12);
    background: transparent;
    cursor: pointer;
    transition: background 0.1s;
}
#dayflow-grid-picker .gp-cell.active {
    background: rgba(247, 158, 51, 0.35);
    border-color: rgba(247, 158, 51, 0.6);
}
#dayflow-grid-picker .gp-label {
    text-align: center;
    color: rgba(var(--ink), 0.5);
    font-weight: 600;
}
/* Find bar — overlays the editor, toggled by ⌘F. */
#dayflow-find-bar {
    position: fixed;
    top: 8px;
    right: 12px;
    z-index: 1002;
    display: none;
    align-items: center;
    gap: 4px;
    background: rgba(var(--panel), 0.98);
    border: 1px solid rgba(var(--ink), 0.12);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    padding: 6px;
    font-size: 13px;
}
#dayflow-find-bar.open { display: inline-flex; }
#dayflow-find-bar input {
    all: unset;
    width: 180px;
    color: rgba(var(--ink), 0.92);
    padding: 4px 8px;
    border-radius: 5px;
    background: rgba(var(--ink), 0.06);
    transition: background 0.15s;
}
#dayflow-find-bar input::placeholder { color: rgba(var(--ink), 0.35); }
#dayflow-find-bar input.miss { background: rgba(239, 68, 68, 0.25); }
#dayflow-find-bar button {
    all: unset;
    min-width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: rgba(var(--ink), 0.8);
    cursor: pointer;
    font-size: 12px;
}
#dayflow-find-bar button:hover { background: rgba(var(--ink), 0.1); }
/* CSS Custom Highlights — match decoration without any DOM or
   selection mutation. WebKit 17.2+ (macOS 14.2+) required; on
   older systems highlights silently no-op but find still
   navigates. */
::highlight(dayflow-find) {
    background-color: rgba(247, 158, 51, 0.32);
    color: inherit;
}
::highlight(dayflow-find-current) {
    background-color: rgba(247, 158, 51, 0.85);
    color: #000;
}
/* Paragraphs whose text is exactly a markdown HR sequence get
   rendered as a divider. `dayflow-hr-marker` lands on the widest
   block-level ancestor (not the narrow `.bn-block-content` which
   is inline-block) so the line spans the row. Caret stays
   visible via `caret-color` so the block is still editable. */
.dayflow-hr-marker {
    position: relative;
}
.dayflow-hr-marker .bn-inline-content,
.dayflow-hr-marker [data-content-type="paragraph"] {
    color: transparent;
    caret-color: rgba(247, 158, 51, 0.9);
}
.dayflow-hr-marker::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: rgba(var(--ink), 0.25);
    transform: translateY(-50%);
    pointer-events: none;
}
</style>
</head>
<body>
<div id="dayflow-toolbar">
  <div class="tb-group">
    <button data-cmd="bold" title="Bold (⌘B)">B</button>
    <button data-cmd="italic" class="italic" title="Italic (⌘I)">I</button>
    <button data-cmd="underline" class="underline" title="Underline (⌘U)">U</button>
    <button data-cmd="strike" class="strike" title="Strikethrough">S</button>
    <button data-cmd="code" class="code" title="Inline Code">{ }</button>
  </div>
  <div class="tb-group">
    <button class="tb-pop" data-pop="textColor" title="Text color">
      <span class="glyph">A</span><span class="ink"></span>
    </button>
    <button class="tb-pop" data-pop="backgroundColor" title="Highlight">
      <span class="glyph">▨</span><span class="ink"></span>
    </button>
  </div>
  <div id="dayflow-color-pop" hidden>
    <span data-row="textColor" hidden></span>
    <span data-row="backgroundColor" hidden></span>
  </div>
</div>
<div id="dayflow-find-bar" role="search" aria-label="Find in page">
  <input type="text" placeholder="Find" spellcheck="false" autocomplete="off" autocapitalize="off">
  <button data-find="prev" title="Previous (⇧↵)">↑</button>
  <button data-find="next" title="Next (↵)">↓</button>
  <button data-find="close" title="Close (Esc)">✕</button>
</div>
<div id="editor"></div>
<script type="module">
import { BlockNoteEditor } from "dayflow-asset://editor/blocknote-entry.mjs";
import {
    blockNoteHtmlToBlocks, blocksToMarkdown, htmlHasBlockStructure, htmlToBlocks, markdownToBlocks, plainTextShape,
} from "dayflow-asset://editor/app/clipboard.mjs";

let editor = null;
let lastEmitted = "";
let suppressEmit = false;

let lastEmittedJSON = "";

function postReady() {
    try { window.webkit.messageHandlers.dayflow.postMessage({ type: "ready" }); } catch (e) {}
}
function postChange(md, json) {
    if (suppressEmit) return;
    if (md === lastEmitted && json === lastEmittedJSON) return;
    lastEmitted = md;
    lastEmittedJSON = json;
    try { window.webkit.messageHandlers.dayflow.postMessage({ type: "change", md: md, json: json }); } catch (e) {}
}
// Tell Swift whether the inner editor still has scroll headroom in
// each direction. Swift uses this to decide between consuming a
// wheel event vs forwarding it to the enclosing SwiftUI ScrollView.
let lastScrollSig = { up: null, down: null };
function postScrollState() {
    const root = document.getElementById('editor');
    if (!root) return;
    // 1px slack soaks up subpixel rounding so we don't oscillate
    // at the boundary.
    const up = root.scrollTop > 1;
    const down = (root.scrollHeight - root.clientHeight - root.scrollTop) > 1;
    if (up === lastScrollSig.up && down === lastScrollSig.down) return;
    lastScrollSig.up = up; lastScrollSig.down = down;
    try {
        window.webkit.messageHandlers.dayflow.postMessage({
            type: "scrollState", canScrollUp: up, canScrollDown: down
        });
    } catch (e) {}
}

// Pasted/dropped files. BlockNote calls `uploadFile` and waits on the promise
// before it fills in the block's `url` prop; without the option it drops the
// file on the floor with a console warning. Bytes go to Swift base64-encoded
// (a WKScriptMessage body can't hold an ArrayBuffer) and come back as a
// `dayflow-asset://attachment/...` URL that outlives the app session — a
// `blob:` URL would die on the next reload and a `data:` URL would bloat the
// note body.
const pendingUploads = new Map();
let uploadSeq = 0;

window.dayflowResolveUpload = function(token, url) {
    const entry = pendingUploads.get(token);
    if (!entry) return;
    pendingUploads.delete(token);
    entry.resolve(url);
};
window.dayflowRejectUpload = function(token, message) {
    const entry = pendingUploads.get(token);
    if (!entry) return;
    pendingUploads.delete(token);
    entry.reject(new Error(message || 'Attachment could not be saved.'));
};

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read the pasted file.'));
        // `readAsDataURL` gives "data:<mime>;base64,<payload>" — take the tail.
        reader.onload = () => {
            const result = String(reader.result || '');
            const comma = result.indexOf(',');
            resolve(comma >= 0 ? result.slice(comma + 1) : '');
        };
        reader.readAsDataURL(file);
    });
}

async function uploadFile(file) {
    const token = 'up' + (++uploadSeq);
    const data = await fileToBase64(file);
    const promise = new Promise((resolve, reject) => {
        pendingUploads.set(token, { resolve, reject });
    });
    window.webkit.messageHandlers.dayflow.postMessage({
        type: 'uploadFile',
        token: token,
        name: file.name || '',
        mime: file.type || '',
        data: data,
    });
    return promise;
}

// Paste pipeline. BlockNote's own paste plugin picks the first flavour in
// [vscode-editor-data, blocknote/html, text/html, text/plain, Files] and hands
// it to its converters, which lose list nesting (see app/clipboard.mjs). This
// capture-phase handler claims the paste whenever the clipboard carries
// structure, converts it with our converters, and inserts blocks at the caret.
// Anything structureless (a word, a sentence) still goes through BlockNote so
// it merges into the caret's line the usual way.
//
// `stopImmediatePropagation` in the capture phase is what keeps BlockNote's
// handler — registered on the ProseMirror node, i.e. later — from running too.
function installPasteHandler() {
    document.addEventListener('paste', (e) => {
        if (!editor || !e.clipboardData) return;
        // A paste aimed at the find field is not a paste into the document.
        if (document.activeElement === findInputEl) return;
        if (!editorRootEl || !editorRootEl.contains(e.target)) return;
        let plan = null;
        try { plan = planPaste(e.clipboardData); } catch (err) { console.log('paste plan error: ' + err.message); }
        if (!plan) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (plan.kind === 'images') {
            insertImageFiles(plan.files);
            return;
        }
        try {
            insertPastedBlocks(plan.blocks);
        } catch (err) {
            console.log('paste insert error: ' + err.message);
        }
        scheduleEmit();
    }, true);
}

function planPaste(data) {
    const files = Array.from(data.files || []);
    const images = files.filter((f) => f.type && f.type.startsWith('image/'));
    const html = data.getData('text/html');
    const text = data.getData('text/plain');
    const htmlDoc = html ? new DOMParser().parseFromString(html, 'text/html') : null;
    const htmlText = htmlDoc ? (htmlDoc.body.textContent || '').trim() : '';

    // Browsers put *both* `<img src="https://…">` HTML and the image bytes on
    // the clipboard when you copy a picture, and a remote `src` renders nothing
    // under the page CSP — so store the bytes instead. But Office, Keynote and
    // Numbers attach a rendered image to every *text* copy too; when there is
    // text to paste, the text is what the user meant. Non-image files still
    // belong to BlockNote, which picks the right block type for them.
    if (images.length && images.length === files.length && !text.trim() && !htmlText) {
        return { kind: 'images', files: images };
    }

    const caret = caretContext();
    // Code blocks take text verbatim; table cells hold inline content only.
    if (caret.inCode || caret.inTable) return null;

    // Our own copy: the internal flavour is the only lossless one.
    const internal = data.getData('blocknote/html');
    if (internal) {
        const blocks = blockNoteHtmlToBlocks(new DOMParser().parseFromString(internal, 'text/html'));
        return blocks && blocks.length ? { kind: 'blocks', blocks } : null;
    }

    // VS Code tags its copies with the source language: markdown and plain
    // text are prose, anything else becomes a code block. (BlockNote's own
    // handler splices the code into HTML unescaped, so `a < b` or JSX
    // loses text, and the result parses as a paragraph anyway.)
    if (data.types.includes('vscode-editor-data')) {
        let mode = '';
        try { mode = JSON.parse(data.getData('vscode-editor-data')).mode || ''; } catch (err) {}
        if (mode && mode !== 'markdown' && mode !== 'plaintext') {
            if (!text) return null;
            const code = text.replace(/\r\n?/g, '\n');
            return { kind: 'blocks', blocks: [{ type: 'codeBlock', props: { language: mode }, content: [{ type: 'text', text: code, styles: {} }], children: [] }] };
        }
        return planPlainText(text, caret);
    }
    if (htmlDoc && htmlText) {
        if (!htmlHasBlockStructure(htmlDoc)) return null;
        const blocks = htmlToBlocks(htmlDoc);
        return blocks.length ? { kind: 'blocks', blocks } : null;
    }
    return planPlainText(text, caret);
}

function planPlainText(text, caret) {
    const shape = plainTextShape(text);
    if (shape === 'blocks' || (shape === 'marker-line' && caret.blankBlock)) {
        const blocks = markdownToBlocks(text);
        return blocks.length ? { kind: 'blocks', blocks } : null;
    }
    return null;
}

function caretContext() {
    const { $from } = editor._tiptapEditor.state.selection;
    let inTable = false;
    for (let d = $from.depth; d > 0; d--) {
        if ($from.node(d).type.name === 'table') inTable = true;
    }
    const cursor = editor.getTextCursorPosition();
    return {
        inCode: $from.parent.type.name === 'codeBlock',
        inTable,
        blankBlock: isBlankBlock(cursor.block),
    };
}

// Once the code highlighter has loaded, a code block whose language it has
// no grammar for throws — the whole insert or note load fails. Map every
// incoming language onto a supported id (BlockNote's list carries the common
// aliases: py, sh, typescriptreact…) and fall back to plain text.
const CODE_LANGUAGE_ALIASES = { javascriptreact: 'jsx', plaintext: 'text' };
let codeLanguageIds = null;
function resolveCodeLanguage(language) {
    if (!codeLanguageIds) {
        const ext = editor._tiptapEditor.extensionManager.extensions.find((e) => e.name === 'codeBlock');
        codeLanguageIds = new Map();
        for (const lang of (ext && ext.options.supportedLanguages) || []) {
            codeLanguageIds.set(lang.id, lang.id);
            for (const alias of lang.match || []) codeLanguageIds.set(alias, lang.id);
        }
    }
    const key = String(language || '').toLowerCase();
    return codeLanguageIds.get(CODE_LANGUAGE_ALIASES[key] || key) || 'text';
}
function normalizeCodeLanguages(blocks) {
    for (const b of blocks) {
        if (b.type === 'codeBlock' && b.props && b.props.language) {
            b.props.language = resolveCodeLanguage(b.props.language);
        }
        if (b.children && b.children.length) normalizeCodeLanguages(b.children);
    }
    return blocks;
}

// A block the paste may simply take over: inline-content block with no text
// (ZWSPs from the IME workaround don't count) and nothing nested under it.
function isBlankBlock(block) {
    if (!block || !Array.isArray(block.content)) return false;
    if (block.children && block.children.length) return false;
    return block.content.every((c) => c.type === 'text' && !c.text.replace(/​/g, ''));
}

// A whole-note copy ends with BlockNote's always-present empty trailing
// paragraph; it is not content the user meant to carry over.
function trimTrailingBlank(blocks) {
    const out = blocks.slice();
    while (out.length > 1 && out[out.length - 1].type === 'paragraph' && isBlankBlock(out[out.length - 1])) out.pop();
    return out;
}

function lastLeaf(block) {
    let b = block;
    while (b.children && b.children.length) b = b.children[b.children.length - 1];
    return b;
}

// Insert pasted blocks as siblings of the caret's block, the way Notion does:
// replace a blank line, go before/after a line when the caret sits at its
// edge, or split the line at the caret and drop the blocks in between.
function insertPastedBlocks(pasted) {
    const blocks = normalizeCodeLanguages(trimTrailingBlank(pasted));
    const tt = editor._tiptapEditor;
    if (!tt.state.selection.empty) tt.commands.deleteSelection();

    const current = editor.getTextCursorPosition().block;
    const { $from } = tt.state.selection;
    let inserted;
    if (isBlankBlock(current)) {
        inserted = editor.replaceBlocks([current], blocks).insertedBlocks;
    } else if ($from.parentOffset === $from.parent.content.size) {
        inserted = editor.insertBlocks(blocks, current, 'after');
    } else if ($from.parentOffset === 0) {
        inserted = editor.insertBlocks(blocks, current, 'before');
    } else {
        // Depth 2 splits both the block content and its blockContainer, so
        // the tail becomes a sibling block (keeping any nested children).
        tt.view.dispatch(tt.state.tr.split($from.pos, 2));
        inserted = editor.insertBlocks(blocks, editor.getTextCursorPosition().block, 'before');
    }
    if (!inserted || !inserted.length) return;
    try {
        editor.setTextCursorPosition(lastLeaf(inserted[inserted.length - 1]), 'end');
    } catch (err) {
        // Tables and images have no text caret; leave the selection where it is.
    }
}

// ⌘⇧V: the text exactly as written, one paragraph per line, no markdown or
// HTML reading. ProseMirror's own plain-text path; our paste handler listens
// for DOM paste events and never sees it.
window.dayflowPastePlainText = function(text) {
    if (!editor || typeof text !== 'string' || !text) return;
    try {
        editor._tiptapEditor.view.pasteText(text);
        scheduleEmit();
    } catch (err) {
        console.log('plain paste error: ' + err.message);
    }
};

// BlockNote writes the plain-text flavour as a loose markdown list (`*   a`,
// a blank line between items). Rewrite it as a tight list other apps read
// cleanly. Runs in the bubble phase, after BlockNote has filled the
// clipboard, and derives the blocks from its internal HTML so the plain text
// covers exactly the copied range (partial first/last lines included).
function installCopyHandler() {
    const rewritePlainText = (e) => {
        if (!e.clipboardData || !editorRootEl || !editorRootEl.contains(e.target)) return;
        try {
            const html = e.clipboardData.getData('blocknote/html');
            if (!html) return;
            const blocks = blockNoteHtmlToBlocks(new DOMParser().parseFromString(html, 'text/html'));
            if (!blocks) return;
            e.clipboardData.setData('text/plain', blocksToMarkdown(trimTrailingBlank(blocks)));
        } catch (err) {
            console.log('copy rewrite error: ' + err.message);
        }
    };
    document.addEventListener('copy', rewritePlainText);
    document.addEventListener('cut', rewritePlainText);

    // With nothing selected, BlockNote still clears the clipboard and writes
    // empty strings, so a stray ⌘C (or ⌘X) wipes whatever was just copied
    // from another app. Keep BlockNote out of it; the native no-op copy of an
    // empty selection leaves the pasteboard alone.
    const skipEmptySelection = (e) => {
        if (!editor || !editorRootEl || !editorRootEl.contains(e.target)) return;
        if (editor._tiptapEditor.state.selection.empty) e.stopImmediatePropagation();
    };
    document.addEventListener('copy', skipEmptySelection, true);
    document.addEventListener('cut', skipEmptySelection, true);
}

async function insertImageFiles(files) {
    for (const file of files) {
        try {
            const url = await uploadFile(file);
            const cursor = editor.getTextCursorPosition();
            editor.insertBlocks(
                [{ type: 'image', props: { url: url, name: file.name || '' } }],
                cursor.block,
                'after'
            );
        } catch (err) {
            console.log('image paste failed: ' + err.message);
        }
    }
    scheduleEmit();
}

// `jsonText` arrives as a JSON string (Swift passes a quoted
// literal, not raw JS), or `null` for markdown-only rows. We
// `JSON.parse` here so a tampered `body_json` in the DB can't
// be interpreted as JS inside the editor origin — the parse
// enforces a data-only boundary.
window.dayflowSetContent = async function(md, jsonText) {
    if (!editor) return;
    try {
        suppressEmit = true;
        let blocks = null;
        if (typeof jsonText === 'string' && jsonText.length > 0) {
            try {
                const parsed = JSON.parse(jsonText);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    blocks = parsed;
                }
            } catch (e) {
                console.log('setContent JSON parse error: ' + e.message);
            }
        }
        if (!blocks) {
            blocks = markdownToBlocks(md || '');
        }
        // Replace blocks that are just HTML comments (e.g. "<!---->")
        // with empty paragraphs to preserve visual spacing.
        blocks = blocks.map(b => {
            if (b.type !== 'paragraph' || !b.content) return b;
            const text = (Array.isArray(b.content) ? b.content : [])
                .map(c => (typeof c === 'string' ? c : c.text || '')).join('').trim();
            if (/^<!--.*-->$/.test(text)) {
                return { type: 'paragraph', props: b.props || {}, content: [], children: [] };
            }
            return b;
        });
        if (blocks.length === 0) {
            blocks.push({ type: 'paragraph', props: {}, content: [], children: [] });
        }
        editor.replaceBlocks(editor.document, normalizeCodeLanguages(blocks));
        lastEmitted = md;
        lastEmittedJSON = typeof jsonText === 'string' ? jsonText : "";
        applyHrStyling();
    } catch (e) {
        console.log('setContent error: ' + e.message + ' :: ' + (e.stack || ''));
    } finally {
        // Swallow the post-replace synchronous onChange.
        setTimeout(() => { suppressEmit = false; }, 50);
    }
};

// An on-hold checkListItem is unchecked and carries the reserved blue
// background on its text. `blocksToMarkdownLossy` can't express that (it
// drops color and writes `- [ ]`), so we re-derive `- [~]` from the
// document after the fact.
function isOnHoldBlock(b) {
    if (b.type !== 'checkListItem' || (b.props && b.props.checked)) return false;
    const content = b.content || [];
    return content.some(r => r && r.type === 'text' && r.styles && r.styles.backgroundColor === 'blue');
}
function collectCheckboxHoldFlags(blocks, out) {
    for (const b of blocks) {
        if (b.type === 'checkListItem') out.push(isOnHoldBlock(b));
        if (b.children && b.children.length) collectCheckboxHoldFlags(b.children, out);
    }
}
// Rewrite the Nth `[ ]` checkbox line to `[~]` when the Nth checkListItem
// (document order) is on-hold. blocksToMarkdownLossy emits checkboxes in
// the same depth-first order collectCheckboxHoldFlags walks, so the two
// line up 1:1. If the counts ever disagree, bail rather than corrupt.
function reMarkOnHold(md, doc) {
    const flags = [];
    collectCheckboxHoldFlags(doc, flags);
    if (!flags.some(Boolean)) return md;
    const lines = md.split('\n');
    const checkboxLineIdx = [];
    for (let i = 0; i < lines.length; i++) {
        if (/^(\s*[-*+]\s+)\[[ xX]\]/.test(lines[i])) checkboxLineIdx.push(i);
    }
    if (checkboxLineIdx.length !== flags.length) return md;
    for (let n = 0; n < flags.length; n++) {
        if (!flags[n]) continue;
        lines[checkboxLineIdx[n]] = lines[checkboxLineIdx[n]].replace(/^(\s*[-*+]\s+)\[ \]/, '$1[~]');
    }
    return lines.join('\n');
}

async function emitCurrentContent() {
    if (!editor) return;
    try {
        let md = await editor.blocksToMarkdownLossy(editor.document);
        let json = JSON.stringify(editor.document);
        // Strip ZWSPs injected by the nested-list IME workaround
        // only when present — avoid an allocation on every emit.
        const ZWSP = '\u200B';
        if (md && md.indexOf(ZWSP) !== -1) md = md.split(ZWSP).join('');
        if (json.indexOf(ZWSP) !== -1) json = json.split(ZWSP).join('');
        md = reMarkOnHold(md, editor.document);
        postChange(md, json);
    } catch (e) {}
}

// 200ms trailing debounce so typing doesn't thrash the bridge.
let emitTimer = null;
function scheduleEmit() {
    if (emitTimer) clearTimeout(emitTimer);
    emitTimer = setTimeout(() => { emitTimer = null; emitCurrentContent(); }, 200);
}

// Sync scroll-overflow state to Swift on every relevant event so the
// wheel-forwarding decision stays accurate. Listeners are attached
// once, after the editor mounts.
function installScrollStateBridge() {
    const root = document.getElementById('editor');
    if (!root) return;
    const refresh = () => postScrollState();
    root.addEventListener('scroll', refresh, { passive: true });
    if (window.ResizeObserver) {
        new ResizeObserver(refresh).observe(root);
    }
    // Mutations inside the editor change content height too.
    if (editorRootEl) {
        new MutationObserver(refresh).observe(editorRootEl, {
            childList: true, subtree: true, characterData: true
        });
    }
    // Initial sync once layout has settled.
    requestAnimationFrame(refresh);
}

// BlockNote default-schema color palette. Names are the public
// `textColor`/`backgroundColor` values accepted by addStyles; the
// hex is the swatch background.
const COLORS = [
    ['red',    '#ef4444'],
    ['orange', '#f59e0b'],
    ['yellow', '#eab308'],
    ['green',  '#22c55e'],
    ['blue',   '#3b82f6'],
    ['purple', '#a855f7'],
];

// Cached NodeLists populated by buildSwatches — refreshToolbarState
// is called on every selection change, so querySelectorAll per call
// would burn DOM work.
let cmdButtons = [];
let colorButtons = { textColor: [], backgroundColor: [] };
let popButtons = [];
let openPop = null;
let lastActiveSig = "";

const COLOR_HEX = Object.fromEntries(COLORS);

function buildSwatches() {
    const bar = document.getElementById('dayflow-toolbar');
    if (!bar) return;
    for (const prop of ['textColor', 'backgroundColor']) {
        const row = bar.querySelector('[data-row="' + prop + '"]');
        if (!row) continue;
        // "Reset to default" button at the front
        const reset = document.createElement('button');
        reset.className = 'swatch swatch-reset';
        reset.dataset.prop = prop;
        reset.dataset.color = 'default';
        reset.title = 'Default';
        reset.textContent = '×';
        row.appendChild(reset);
        for (const [name, hex] of COLORS) {
            const b = document.createElement('button');
            b.className = 'swatch';
            b.dataset.prop = prop;
            b.dataset.color = name;
            b.style.background = hex;
            b.title = name;
            row.appendChild(b);
        }
        colorButtons[prop] = Array.from(row.querySelectorAll('button'));
    }
    cmdButtons = Array.from(bar.querySelectorAll('button[data-cmd]'));
    popButtons = Array.from(bar.querySelectorAll('button[data-pop]'));
}

/// Expand the swatch row for one property, collapsing the other.
function toggleColorPop(prop) {
    const pop = document.getElementById('dayflow-color-pop');
    if (!pop) return;
    if (openPop === prop) { closeColorPop(); return; }
    openPop = prop;
    for (const p of ['textColor', 'backgroundColor']) {
        const row = pop.querySelector('[data-row="' + p + '"]');
        if (row) row.hidden = (p !== prop);
    }
    pop.hidden = false;
    document.getElementById('dayflow-toolbar').classList.add('pop-open');
    for (const b of popButtons) b.classList.toggle('active', b.dataset.pop === prop);
}

function closeColorPop() {
    const pop = document.getElementById('dayflow-color-pop');
    if (pop) pop.hidden = true;
    document.getElementById('dayflow-toolbar').classList.remove('pop-open');
    openPop = null;
    for (const b of popButtons) b.classList.remove('active');
}

// mousedown + preventDefault keeps the editor's text selection
// intact — plain click would steal focus and collapse the selection
// before the style call lands.
function bindToolbar() {
    const bar = document.getElementById('dayflow-toolbar');
    if (!bar) return;
    bar.addEventListener('mousedown', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        e.preventDefault();
        if (btn.dataset.pop) {
            toggleColorPop(btn.dataset.pop);
            return;
        }
        if (!editor) return;
        try {
            const cmd = btn.dataset.cmd;
            if (cmd) {
                editor.toggleStyles({ [cmd]: true });
            } else if (btn.dataset.prop) {
                const prop = btn.dataset.prop;
                const color = btn.dataset.color;
                const active = editor.getActiveStyles() || {};
                if (color === 'default') {
                    if (active[prop] != null && active[prop] !== '') {
                        editor.removeStyles({ [prop]: active[prop] });
                    }
                } else if (active[prop] === color) {
                    editor.removeStyles({ [prop]: color });
                } else {
                    editor.addStyles({ [prop]: color });
                }
            }
        } catch (err) {
            console.log('toolbar cmd error: ' + err.message);
        }
        // A colour pick is a complete action — leaving the panel open just
        // covers the text you were looking at.
        closeColorPop();
        refreshToolbarState();
        scheduleEmit();
    });

    // Click anywhere else, or press Escape, and the panel goes away. No
    // preventDefault here: this must not swallow ordinary clicks into the
    // document body.
    document.addEventListener('mousedown', (e) => {
        if (openPop && !e.target.closest('#dayflow-toolbar')) closeColorPop();
    });
    document.addEventListener('keydown', (e) => {
        if (openPop && e.key === 'Escape') closeColorPop();
    });
}

// Theme from Swift (Settings → Appearance). Light themes also flip
// `color-scheme` so native controls (find field, scrollbars) match.
window.dayflowSetTheme = function(ink, panel, isDark) {
    const root = document.documentElement.style;
    root.setProperty('--ink', ink);
    root.setProperty('--panel', panel);
    root.setProperty('color-scheme', isDark ? 'dark' : 'light');
    root.setProperty('--code-bg', isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgb(36, 38, 45)');
};

function syncSelectionClass() {
    try {
        document.body.classList.toggle('has-selection', !editor._tiptapEditor.state.selection.empty);
    } catch (e) {}
}

// Day rail → editor: bring a heading to the top of the view. Matched on
// letters and digits only, since the rail's title comes from the stored
// markdown (escapes, emphasis markers) and the block holds plain text.
window.dayflowScrollToHeading = function(title) {
    if (!editor || !editorRootEl) return;
    const key = (s) => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
    const text = (content) => (Array.isArray(content) ? content : [])
        .map((r) => (r.type === 'link' ? text(r.content) : (r.text || ''))).join('');
    const want = key(title);
    const find = (blocks) => {
        for (const b of blocks) {
            if (b.type === 'heading' && key(text(b.content)) === want) return b;
            const nested = find(b.children || []);
            if (nested) return nested;
        }
        return null;
    };
    const hit = find(editor.document);
    const el = hit && editorRootEl.querySelector('[data-id="' + CSS.escape(hit.id) + '"]');
    if (!el) return;
    const top = el.getBoundingClientRect().top - editorRootEl.getBoundingClientRect().top + editorRootEl.scrollTop - 8;
    editorRootEl.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    const content = el.querySelector('.bn-block-content') || el;
    content.classList.add('dayflow-flash');
    setTimeout(() => content.classList.remove('dayflow-flash'), 900);
};

function refreshToolbarState() {
    if (!editor) return;
    let active = {};
    try { active = editor.getActiveStyles() || {}; } catch (e) {}
    // Dirty-check: selection changes fire on every caret move, but
    // the active-style signature usually hasn't changed.
    const sig = (active.bold?1:0) + '|' + (active.italic?1:0) + '|' +
                (active.underline?1:0) + '|' + (active.strike?1:0) + '|' +
                (active.code?1:0) + '|' +
                (active.textColor || 'default') + '|' +
                (active.backgroundColor || 'default');
    if (sig === lastActiveSig) return;
    lastActiveSig = sig;
    for (const b of cmdButtons) {
        b.classList.toggle('active', !!active[b.dataset.cmd]);
    }
    // Color swatches: highlight ONLY a non-default color that's
    // actually applied to the selection. The "×" (default) button
    // never wears the active ring — a blank selection is the normal
    // state and shouldn't look selected.
    for (const prop of ['textColor', 'backgroundColor']) {
        const current = active[prop];
        for (const b of colorButtons[prop]) {
            const val = b.dataset.color;
            const isActive = (val !== 'default') && (val === current);
            b.classList.toggle('active', isActive);
        }
    }
    // With the swatches folded away, the trigger's underline is the only
    // thing that says which colour the selection already carries.
    for (const b of popButtons) {
        const ink = b.querySelector('.ink');
        if (!ink) continue;
        const current = active[b.dataset.pop];
        ink.style.background = COLOR_HEX[current] || 'rgba(var(--ink), 0.22)';
    }
}

// Slash command menu — custom vanilla implementation since
// @blocknote/core on its own doesn't ship a slash menu UI (that
// piece lives in @blocknote/react). labelLower is precomputed so
// filter keystrokes don't re-lowercase 7 strings per render.
const SLASH_COMMANDS = (() => {
    const defs = [
        { key: 'h1',   icon: 'H1', label: 'Heading 1',     block: { type: 'heading', props: { level: 1 } } },
        { key: 'h2',   icon: 'H2', label: 'Heading 2',     block: { type: 'heading', props: { level: 2 } } },
        { key: 'h3',   icon: 'H3', label: 'Heading 3',     block: { type: 'heading', props: { level: 3 } } },
        { key: 'todo', icon: '☐',  label: 'To-do list',    block: { type: 'checkListItem', props: { checked: false } } },
        { key: 'ul',   icon: '•',  label: 'Bullet list',   block: { type: 'bulletListItem' } },
        { key: 'ol',   icon: '1.', label: 'Numbered list', block: { type: 'numberedListItem' } },
        { key: 'code', icon: '{ }', label: 'Code Block',   block: { type: 'codeBlock' } },
        { key: 'table', icon: '▦', label: 'Table',         block: { type: 'table' } },
        { key: 'p',    icon: '¶',  label: 'Paragraph',     block: { type: 'paragraph' } },
    ];
    return defs.map(d => ({ ...d, labelLower: d.label.toLowerCase() }));
})();

// Menu singleton. Items are built once in `openSlashMenu` and
// reused; filter keystrokes toggle `.style.display` on the
// cached nodes instead of rebuilding innerHTML.
let slashMenuEl = null;
let slashItemNodes = [];        // [{ el, cmd }] — one per SLASH_COMMANDS entry
let slashVisibleItems = [];     // subset currently shown, in display order
let slashQuery = '';
let slashSelectedIndex = 0;

function applyBlockType(block) {
    if (!editor) return;
    try {
        const cursor = editor.getTextCursorPosition();
        if (!cursor || !cursor.block) return;
        if (block.type === 'table') {
            insertTable(3, 3);
            return;
        }
        editor.updateBlock(cursor.block, block);
        scheduleEmit();
    } catch (e) {
        console.log('applyBlockType error: ' + e.message);
    }
}

function isCurrentBlockEmpty() {
    if (!editor) return false;
    try {
        const cursor = editor.getTextCursorPosition();
        if (!cursor || !cursor.block) return false;
        const content = cursor.block.content;
        if (!Array.isArray(content)) return true;
        for (const c of content) {
            if (c && typeof c.text === 'string' && c.text.length > 0) return false;
        }
        return true;
    } catch (e) { return false; }
}

function openSlashMenu() {
    if (slashMenuEl) return;
    slashMenuEl = document.createElement('div');
    slashMenuEl.id = 'dayflow-slash-menu';
    const list = document.createElement('div');
    list.className = 'sm-list';
    slashMenuEl.appendChild(list);
    slashItemNodes = [];
    for (const cmd of SLASH_COMMANDS) {
        const el = document.createElement('div');
        el.className = 'sm-item';
        el.innerHTML =
            '<span class="sm-icon">' + cmd.icon + '</span>' +
            '<span class="sm-label">' + cmd.label + '</span>' +
            '<span class="sm-sub">/' + cmd.key + '</span>';
        el.addEventListener('mousedown', (ev) => {
            ev.preventDefault();
            commitSlashCommand(cmd);
        });
        list.appendChild(el);
        slashItemNodes.push({ el, cmd });
    }
    document.body.appendChild(slashMenuEl);
    slashQuery = '';
    slashSelectedIndex = 0;
    positionSlashMenu();
    renderSlashMenu();
}

function closeSlashMenu() {
    if (!slashMenuEl) return;
    slashMenuEl.remove();
    slashMenuEl = null;
    slashItemNodes = [];
    slashVisibleItems = [];
    slashQuery = '';
    slashSelectedIndex = 0;
}

// Shared popup positioning: place `el` below the caret,
// clamped so it doesn't overflow the viewport.
function positionPopup(el, vMargin, hMargin) {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    let rect = sel.getRangeAt(0).getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
        const fb = document.querySelector('.bn-block-content[data-is-empty-and-focused="true"]');
        if (fb) rect = fb.getBoundingClientRect();
    }
    el.style.top = Math.min(window.innerHeight - vMargin, rect.bottom + 6) + 'px';
    el.style.left = Math.min(window.innerWidth - hMargin, Math.max(8, rect.left)) + 'px';
}

function positionSlashMenu() {
    if (!slashMenuEl) return;
    positionPopup(slashMenuEl, 380, 340);
}

function renderSlashMenu() {
    if (!slashMenuEl) return;
    const q = slashQuery.trim().toLowerCase();
    slashVisibleItems = [];
    for (const item of slashItemNodes) {
        const match = !q || item.cmd.labelLower.includes(q) || item.cmd.key.includes(q);
        item.el.style.display = match ? 'flex' : 'none';
        if (match) slashVisibleItems.push(item);
    }
    if (slashSelectedIndex >= slashVisibleItems.length) {
        slashSelectedIndex = Math.max(0, slashVisibleItems.length - 1);
    }
    for (let i = 0; i < slashVisibleItems.length; i++) {
        slashVisibleItems[i].el.classList.toggle('selected', i === slashSelectedIndex);
    }
    // Empty-state row — created lazily, reused across filters.
    let empty = slashMenuEl.querySelector('.sm-empty');
    if (slashVisibleItems.length === 0) {
        if (!empty) {
            empty = document.createElement('div');
            empty.className = 'sm-empty';
            empty.textContent = 'No commands';
            slashMenuEl.querySelector('.sm-list').appendChild(empty);
        }
    } else if (empty) {
        empty.remove();
    }
}

function commitSlashCommand(cmd) {
    if (!cmd) return;
    closeSlashMenu();
    if (cmd.block.type === 'table') {
        openGridPicker();
    } else {
        applyBlockType(cmd.block);
    }
}

// Grid picker for table size selection (6×6 max)
let gridPickerEl = null;

function openGridPicker() {
    if (gridPickerEl) return;
    gridPickerEl = document.createElement('div');
    gridPickerEl.id = 'dayflow-grid-picker';

    const grid = document.createElement('div');
    grid.className = 'gp-grid';

    const MAX = 6;
    const cells = [];
    for (let r = 0; r < MAX; r++) {
        for (let c = 0; c < MAX; c++) {
            const cell = document.createElement('div');
            cell.className = 'gp-cell';
            cell._r = r;
            cell._c = c;
            grid.appendChild(cell);
            cells.push(cell);
        }
    }

    const label = document.createElement('div');
    label.className = 'gp-label';
    label.textContent = 'Select size';

    gridPickerEl.appendChild(grid);
    gridPickerEl.appendChild(label);
    document.body.appendChild(gridPickerEl);
    positionPopup(gridPickerEl, 250, 200);

    grid.addEventListener('mouseover', (ev) => {
        const cell = ev.target.closest('.gp-cell');
        if (!cell) return;
        const hr = cell._r;
        const hc = cell._c;
        for (const c of cells) {
            c.classList.toggle('active', c._r <= hr && c._c <= hc);
        }
        label.textContent = (hc + 1) + ' × ' + (hr + 1);
    });

    grid.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        const cell = ev.target.closest('.gp-cell');
        if (!cell) return;
        const rows = cell._r + 1;
        const cols = cell._c + 1;
        closeGridPicker();
        insertTable(rows, cols);
    });
}

function closeGridPicker() {
    if (!gridPickerEl) return;
    gridPickerEl.remove();
    gridPickerEl = null;
}

function insertTable(numRows, numCols) {
    if (!editor) return;
    try {
        const cursor = editor.getTextCursorPosition();
        if (!cursor || !cursor.block) return;
        const makeRow = () => {
            const cells = [];
            for (let i = 0; i < numCols; i++) {
                cells.push([{ type: 'text', text: '', styles: {} }]);
            }
            return { cells };
        };
        const rows = [];
        for (let i = 0; i < numRows; i++) {
            rows.push(makeRow());
        }
        const tableBlock = {
            type: 'table',
            content: { type: 'tableContent', rows },
            children: [],
        };
        editor.insertBlocks([tableBlock], cursor.block, 'after');
        if (isCurrentBlockEmpty()) {
            editor.removeBlocks([cursor.block]);
        }
        scheduleEmit();
    } catch (e) {
        console.log('insertTable error: ' + e.message);
    }
}

// Find bar — opened by ⌘F. We deliberately avoid `window.find()`:
// it moves the document selection into the editor's contenteditable,
// stealing focus from the find input so subsequent keystrokes type
// into the editor instead. Instead we TreeWalk text nodes for
// matches and decorate them via the CSS Custom Highlights API —
// no DOM and no selection mutation, so the input keeps focus.
const findBarEl = document.getElementById('dayflow-find-bar');
const findInputEl = findBarEl.querySelector('input');
const editorRootEl = document.getElementById('editor');
let findMatches = [];
let findCurrentIndex = -1;
const findHighlightsSupported = !!(window.CSS && CSS.highlights && typeof Highlight !== 'undefined');

function markFindMiss(miss) {
    findInputEl.classList.toggle('miss', !!miss);
}

// Render both the all-matches highlight and the current-match
// highlight. `CSS.highlights.set` replaces existing entries, so
// we only explicitly delete when transitioning to empty.
function renderFindHighlights() {
    if (!findHighlightsSupported) return;
    try {
        if (findMatches.length === 0) {
            CSS.highlights.delete('dayflow-find');
            CSS.highlights.delete('dayflow-find-current');
            return;
        }
        CSS.highlights.set('dayflow-find', new Highlight(...findMatches));
        if (findCurrentIndex >= 0) {
            CSS.highlights.set('dayflow-find-current', new Highlight(findMatches[findCurrentIndex]));
        } else {
            CSS.highlights.delete('dayflow-find-current');
        }
    } catch (e) { console.log('find highlight error: ' + e.message); }
}

// Lightweight update when only the current match moved —
// skips re-allocating the full-matches Highlight (potentially
// thousands of ranges) on every ↑/↓.
function updateCurrentHighlight() {
    if (!findHighlightsSupported) return;
    try {
        if (findCurrentIndex < 0 || findCurrentIndex >= findMatches.length) {
            CSS.highlights.delete('dayflow-find-current');
            return;
        }
        CSS.highlights.set('dayflow-find-current', new Highlight(findMatches[findCurrentIndex]));
    } catch (e) { console.log('find highlight error: ' + e.message); }
}

function computeFindMatches(query) {
    const matches = [];
    if (!query || !editorRootEl) return matches;
    const walker = document.createTreeWalker(editorRootEl, NodeFilter.SHOW_TEXT, null);
    const qLower = query.toLowerCase();
    const qLen = query.length;
    let node;
    while ((node = walker.nextNode())) {
        const text = node.nodeValue;
        if (!text) continue;
        const tLower = text.toLowerCase();
        let idx = 0;
        while (true) {
            const found = tLower.indexOf(qLower, idx);
            if (found === -1) break;
            const range = document.createRange();
            range.setStart(node, found);
            range.setEnd(node, found + qLen);
            matches.push(range);
            idx = found + qLen;
        }
    }
    return matches;
}

function scrollCurrentMatchIntoView(smooth) {
    if (findCurrentIndex < 0 || findCurrentIndex >= findMatches.length) return;
    if (!editorRootEl) return;
    const rect = findMatches[findCurrentIndex].getBoundingClientRect();
    const cRect = editorRootEl.getBoundingClientRect();
    if (rect.top < cRect.top + 20 || rect.bottom > cRect.bottom - 20) {
        const offset = rect.top - cRect.top - (cRect.height / 3);
        editorRootEl.scrollBy({ top: offset, behavior: smooth ? 'smooth' : 'instant' });
    }
}

function runFindSearch() {
    const q = findInputEl.value;
    findMatches = computeFindMatches(q);
    if (!q) {
        findCurrentIndex = -1;
        markFindMiss(false);
        renderFindHighlights();
        return;
    }
    if (findMatches.length === 0) {
        findCurrentIndex = -1;
        markFindMiss(true);
        renderFindHighlights();
        return;
    }
    markFindMiss(false);
    findCurrentIndex = 0;
    renderFindHighlights();
    scrollCurrentMatchIntoView(false);
}

// Trailing-debounce the TreeWalker search so rapid typing (especially
// Korean IME, which fires `input` per jamo) doesn't re-walk the whole
// editor on every keystroke.
let findSearchTimer = null;
function scheduleFindSearch() {
    if (findSearchTimer) clearTimeout(findSearchTimer);
    findSearchTimer = setTimeout(() => { findSearchTimer = null; runFindSearch(); }, 120);
}

function navigateFind(backward) {
    if (findMatches.length === 0) return;
    findCurrentIndex = backward
        ? (findCurrentIndex - 1 + findMatches.length) % findMatches.length
        : (findCurrentIndex + 1) % findMatches.length;
    updateCurrentHighlight();
    scrollCurrentMatchIntoView(true);
}

window.dayflowOpenFind = function() {
    findBarEl.classList.add('open');
    findInputEl.focus();
    findInputEl.select();
    // Editor content may have changed since last open; re-run so
    // stale ranges don't point into replaced text nodes.
    if (findInputEl.value) runFindSearch();
};

function closeFindBar() {
    findBarEl.classList.remove('open');
    markFindMiss(false);
    findMatches = [];
    findCurrentIndex = -1;
    renderFindHighlights();
}

findInputEl.addEventListener('input', scheduleFindSearch);

findInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeFindBar();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        navigateFind(e.shiftKey);
    }
});

findBarEl.addEventListener('mousedown', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.preventDefault();
    const action = btn.dataset.find;
    if (action === 'close') { closeFindBar(); return; }
    findInputEl.focus();
    if (action === 'next') navigateFind(false);
    else if (action === 'prev') navigateFind(true);
});

// Capture-phase keydown so we intercept `/`, arrows, Enter, etc.
// before ProseMirror sees them.
document.addEventListener('keydown', (e) => {
    // When focus is in the find input, let its own handlers run
    // and skip all editor-level shortcuts (slash menu, table
    // backspace). Without this, typing `/` in the find field
    // would false-trigger the slash menu.
    if (document.activeElement === findInputEl) return;

    // IME composition guard — Korean/Japanese/Chinese input
    // pre-commit keys fire with `key: "Process"` / isComposing
    // true and keyCode 229. Ignore so ProseMirror handles the
    // composition cleanly.
    if (e.isComposing || e.keyCode === 229) {
        // Enter pressed mid-composition hits a ProseMirror/BlockNote
        // 0.18 bug: the in-flight IME character gets committed AND
        // duplicated onto the new line. Swallow the raw Enter so
        // the IME only commits; the user presses Enter again (after
        // composition ends) to get the newline. This matches macOS
        // native text-field semantics.
        if (e.key === 'Enter') {
            e.preventDefault();
            e.stopPropagation();
        }
        return;
    }

    // Grid picker intercepts Escape
    if (gridPickerEl) {
        if (e.key === 'Escape') { e.preventDefault(); closeGridPicker(); }
        return;
    }

    if (!slashMenuEl) {
        if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && isCurrentBlockEmpty()) {
            e.preventDefault();
            openSlashMenu();
        }
        // Backspace inside a table when current cell is empty →
        // delete the entire table block. If the cell has content,
        // let ProseMirror handle normal text deletion.
        if (e.key === 'Backspace' && !e.metaKey && !e.ctrlKey && editor) {
            try {
                const cursor = editor.getTextCursorPosition();
                if (!cursor || !cursor.block) throw 0;
                let tableBlock = null;
                if (cursor.block.type === 'table') {
                    tableBlock = cursor.block;
                } else if (cursor.parentBlock && cursor.parentBlock.type === 'table') {
                    tableBlock = cursor.parentBlock;
                }
                if (!tableBlock) throw 0;
                // Only delete if the current cell is empty
                if (isCurrentBlockEmpty()) {
                    e.preventDefault();
                    editor.removeBlocks([tableBlock]);
                    scheduleEmit();
                }
            } catch (err) {}
        }
        return;
    }
    if (e.key === 'Escape') {
        e.preventDefault();
        closeSlashMenu();
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        slashSelectedIndex = Math.min(slashVisibleItems.length - 1, slashSelectedIndex + 1);
        renderSlashMenu();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        slashSelectedIndex = Math.max(0, slashSelectedIndex - 1);
        renderSlashMenu();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        const picked = slashVisibleItems[slashSelectedIndex];
        if (picked) commitSlashCommand(picked.cmd);
    } else if (e.key === 'Backspace') {
        e.preventDefault();
        if (slashQuery.length === 0) {
            closeSlashMenu();
        } else {
            // Surrogate-safe: slice by grapheme-ish (Array.from
            // splits by code point) so supplementary chars
            // aren't cut mid-pair.
            const chars = Array.from(slashQuery);
            chars.pop();
            slashQuery = chars.join('');
            slashSelectedIndex = 0;
            renderSlashMenu();
        }
    } else if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        slashQuery += e.key;
        slashSelectedIndex = 0;
        renderSlashMenu();
    }
}, true);

document.addEventListener('mousedown', (e) => {
    if (gridPickerEl && !gridPickerEl.contains(e.target)) {
        closeGridPicker();
    }
    if (!slashMenuEl) return;
    if (slashMenuEl.contains(e.target)) return;
    closeSlashMenu();
}, true);

// Horizontal rule — paragraphs whose trimmed text matches a
// markdown HR sequence get a marker class that CSS renders as
// a divider. The marker lands on the widest block-level
// ancestor (not the narrow inline-block `.bn-block-content`)
// so the line spans the full row; we walk up until we hit the
// ProseMirror/editor boundary rather than trusting a specific
// BlockNote wrapper class, because those have renamed across
// versions.
const HR_TEXT_RE = /^(?:-{3,}|\*{3,}|_{3,})$/;
const HR_CLASS = 'dayflow-hr-marker';

function findHrWrapper(p, root) {
    let best = p;
    let bestWidth = p.offsetWidth;
    for (let cur = p; cur; cur = cur.parentElement) {
        const parent = cur.parentElement;
        if (!parent || parent === root) break;
        if (parent.classList.contains('ProseMirror')) break;
        if (parent.classList.contains('bn-editor')) break;
        if (parent.offsetWidth > bestWidth) { best = parent; bestWidth = parent.offsetWidth; }
    }
    return best;
}

function applyHrStyling() {
    if (!editorRootEl) return;
    for (const p of editorRootEl.querySelectorAll('[data-content-type="paragraph"]')) {
        const t = (p.textContent || '').replace(/\u200B/g, '').trim();
        const isHr = HR_TEXT_RE.test(t);
        // Clear any stale marker that may have been set on an
        // ancestor when this paragraph was previously an HR.
        for (let cur = p; cur && cur !== editorRootEl; cur = cur.parentElement) {
            cur.classList.remove(HR_CLASS);
        }
        if (isHr) findHrWrapper(p, editorRootEl).classList.add(HR_CLASS);
    }
}

// Primary trigger is the MutationObserver (fires synchronously
// with ProseMirror's DOM writes; onEditorContentChange is async
// and can lag the visible state). rAF-coalesced to absorb bursts.
let hrObserver = null;
let hrRafPending = false;
function scheduleHrStyling() {
    if (hrRafPending) return;
    hrRafPending = true;
    requestAnimationFrame(() => {
        hrRafPending = false;
        // Cheap dirty-check: if no HR sequence appears anywhere in
        // the editor, skip the per-paragraph walk entirely.
        if (!editorRootEl) return;
        const t = editorRootEl.textContent || '';
        if (t.indexOf('---') === -1 && t.indexOf('***') === -1 && t.indexOf('___') === -1) {
            // Still clear any leftover markers from a prior HR state.
            const stale = editorRootEl.querySelectorAll('.' + HR_CLASS);
            for (const s of stale) s.classList.remove(HR_CLASS);
            return;
        }
        applyHrStyling();
    });
}
function installHrObserver() {
    if (!editorRootEl || hrObserver) return;
    hrObserver = new MutationObserver(scheduleHrStyling);
    hrObserver.observe(editorRootEl, { childList: true, subtree: true, characterData: true });
}

// Nested-list Korean IME workaround. ProseMirror has a known bug
// where composing IME text into an empty nested list item (depth ≥ 2)
// causes the committed syllable to be duplicated onto a new
// sibling block. Inserting a zero-width space at compositionstart
// gives PM a pre-existing text node to write into, avoiding the
// split path. The ZWSP is stripped from exported markdown/JSON.
// See: ProseMirror discuss thread on composition regressions +
// obsidian-day-planner#759 (same repro in another PM-based editor).
function installNestedImeWorkaround() {
    if (!editorRootEl || !editor) return;
    editorRootEl.addEventListener('compositionstart', () => {
        try {
            // NOTE: `_tiptapEditor` is BlockNote-internal (underscore
            // prefix) and can churn across @blocknote/core bumps.
            // Re-verify on every upgrade.
            const tt = editor._tiptapEditor;
            if (!tt) return;
            const { $from } = tt.state.selection;
            // depth ≥ 2 = inside at least one list-item parent;
            // content.size === 0 = current block is empty (composition
            // is about to write its first character).
            if ($from.depth >= 2 && $from.parent.content.size === 0) {
                tt.commands.insertContent('\u200B');
            }
        } catch (e) { console.log('nested-IME workaround error: ' + e.message); }
    }, true);
}

// Checkbox toggle. BlockNote 0.22 + @blocknote/core only (no React)
// doesn't reliably wire the native input change → block.props.checked
// path, so clicking the rendered checkbox is a no-op. Delegate from
// the editor root: locate the surrounding block via [data-id] and
// flip `checked` through the editor API. mousedown (not click) so
// ProseMirror's own click handler can't swallow the event first;
// preventDefault stops focus from jumping into the contentEditable
// and collapsing the toggle.
function installCheckboxToggle() {
    if (!editorRootEl || !editor) return;
    editorRootEl.addEventListener('mousedown', (e) => {
        const input = e.target && e.target.closest && e.target.closest('input[type="checkbox"]');
        if (!input) return;
        const blockEl = input.closest('[data-id]');
        const blockId = blockEl && blockEl.getAttribute('data-id');
        if (!blockId) return;
        e.preventDefault();
        e.stopPropagation();
        try {
            const block = editor.getBlock(blockId);
            if (!block || block.type !== 'checkListItem') return;
            const next = !(block.props && block.props.checked);
            editor.updateBlock(blockId, { props: { checked: next } });
            scheduleEmit();
        } catch (err) { console.log('checkbox toggle error: ' + err.message); }
    }, true);
}

// Right-click a checkbox to set its lifecycle status. Done/undone is a
// checked boolean; on-hold ("보류") is unchecked + the reserved blue
// background on the item's text, which the emit path turns into `- [~]`.
let statusMenuEl = null;
function dismissStatusMenu() {
    if (statusMenuEl) { statusMenuEl.remove(); statusMenuEl = null; }
}
function setTaskStatus(blockId, status) {
    try {
        const block = editor.getBlock(blockId);
        if (!block || block.type !== 'checkListItem') return;
        const content = (block.content || []).map(run => {
            if (run.type !== 'text') return run;
            const styles = Object.assign({}, run.styles);
            if (status === 'hold') styles.backgroundColor = 'blue';
            else delete styles.backgroundColor;
            return Object.assign({}, run, { styles });
        });
        editor.updateBlock(blockId, { props: { checked: status === 'done' }, content });
        scheduleEmit();
    } catch (err) { console.log('setTaskStatus error: ' + err.message); }
}
function showStatusMenu(x, y, blockId) {
    dismissStatusMenu();
    const menu = document.createElement('div');
    menu.id = 'dayflow-status-menu';
    const items = [
        { status: 'open', dot: 'open', label: 'To do' },
        { status: 'done', dot: 'done', label: 'Done' },
        { status: 'hold', dot: 'hold', label: 'On hold' },
    ];
    for (const it of items) {
        const row = document.createElement('div');
        row.className = 'item';
        const dot = document.createElement('span');
        dot.className = 'dot ' + it.dot;
        const text = document.createElement('span');
        text.textContent = it.label;
        row.appendChild(dot);
        row.appendChild(text);
        row.addEventListener('mousedown', (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            setTaskStatus(blockId, it.status);
            dismissStatusMenu();
        }, true);
        menu.appendChild(row);
    }
    document.body.appendChild(menu);
    // Keep the menu on-screen.
    const rect = menu.getBoundingClientRect();
    const px = Math.min(x, window.innerWidth - rect.width - 8);
    const py = Math.min(y, window.innerHeight - rect.height - 8);
    menu.style.left = px + 'px';
    menu.style.top = py + 'px';
    statusMenuEl = menu;
}
function installStatusContextMenu() {
    if (!editorRootEl || !editor) return;
    editorRootEl.addEventListener('contextmenu', (e) => {
        const blockEl = e.target && e.target.closest
            && e.target.closest('.bn-block-content[data-content-type="checkListItem"]');
        if (!blockEl) return;
        const idEl = e.target.closest('[data-id]');
        const blockId = idEl && idEl.getAttribute('data-id');
        if (!blockId) return;
        e.preventDefault();
        e.stopPropagation();
        showStatusMenu(e.clientX, e.clientY, blockId);
    }, true);
    // Dismiss on any outside interaction.
    document.addEventListener('mousedown', (e) => {
        if (statusMenuEl && !statusMenuEl.contains(e.target)) dismissStatusMenu();
    }, true);
    document.addEventListener('scroll', dismissStatusMenu, true);
    window.addEventListener('blur', dismissStatusMenu);
}

(async () => {
    try {
        editor = BlockNoteEditor.create({
            domAttributes: { editor: { class: 'bn-editor' } },
            initialContent: undefined,
            uploadFile: uploadFile,
        });
        editor.mount(document.getElementById('editor'));
        installHrObserver();
        installNestedImeWorkaround();
        installCheckboxToggle();
        installStatusContextMenu();
        installPasteHandler();
        installCopyHandler();
        installScrollStateBridge();
        editor.onEditorContentChange(() => { scheduleHrStyling(); scheduleEmit(); postScrollState(); });
        if (editor.onEditorSelectionChange) {
            editor.onEditorSelectionChange(() => {
                syncSelectionClass();
                refreshToolbarState();
            });
        }
        buildSwatches();
        bindToolbar();
        refreshToolbarState();
        postReady();
    } catch (e) {
        console.error('BlockNote init error: ' + e.message + ' :: ' + (e.stack || ''));
    }
})();
</script>
</body>
</html>
